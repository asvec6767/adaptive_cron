name: Lab2 Security
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Analysis-only demo (production always checked)'
        type: choice
        options: [fixed, vulnerable]
        default: fixed
permissions:
  contents: read
concurrency:
  group: lab2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Build, lint, SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build CI image
        run: docker build --progress=plain -t adaptive-cron-ci:lab2 -f lab2/Dockerfile.ci .
      - name: Gate unit tests
        run: python3 -m unittest discover -s lab2/tests -v
      - name: Collect production evidence
        run: >-
          docker run --rm -v "$PWD:/workspace" adaptive-cron-ci:lab2
          python3 lab2/run_checks.py --source . --output lab2/artifacts/production
      - name: Collect isolated fixture evidence
        env:
          FIXTURE: ${{ inputs.fixture || 'fixed' }}
        run: >-
          docker run --rm -v "$PWD:/workspace" adaptive-cron-ci:lab2
          python3 lab2/run_checks.py --source "lab2/fixtures/$FIXTURE" --output lab2/artifacts/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab2-evidence
          path: lab2/artifacts/
          if-no-files-found: error
          retention-days: 14
  security-gate:
    name: Security Gate
    needs: analyze
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lab2-evidence
          path: lab2/artifacts/
      - name: Validate all evidence (fail closed)
        env:
          UPSTREAM: ${{ needs.analyze.result }}
        shell: bash
        run: |
          set +e
          python3 lab2/security_gate.py lab2/artifacts/production
          production=$?
          python3 lab2/security_gate.py lab2/artifacts/demo
          demo=$?
          test "$UPSTREAM" = success && test "$production" = 0 && test "$demo" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab2-gate-decisions
          path: lab2/artifacts/**/gate.json
          if-no-files-found: error
          retention-days: 14
