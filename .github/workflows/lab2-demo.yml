name: Lab2 Isolated Demo
on:
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Select vulnerable (must block) or fixed (must pass)'
        type: choice
        options: [vulnerable, fixed]
        required: true
        default: vulnerable
permissions:
  contents: read
jobs:
  demonstration:
    name: Isolated Build / SAST / Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build CI image
        run: docker build --progress=plain -t adaptive-cron-ci:lab2 -f lab2/Dockerfile.ci .
      - name: Gate unit tests
        run: python3 -m unittest discover -s lab2/tests -v
      - name: Build, vet, Staticcheck, gosec (no execution)
        env:
          FIXTURE: ${{ inputs.fixture }}
        run: >-
          docker run --rm -v "$PWD:/workspace" adaptive-cron-ci:lab2
          python3 lab2/run_checks.py --source "lab2/fixtures/$FIXTURE" --output lab2/artifacts/demo
      - name: Security Gate
        if: always()
        run: python3 lab2/security_gate.py lab2/artifacts/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab2-isolated-demo-${{ inputs.fixture }}
          path: lab2/artifacts/demo/
          if-no-files-found: error
          retention-days: 14
