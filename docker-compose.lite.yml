version: '3.8'

services:
  app-lite:
    image: adaptive-cron:latest
    container_name: adaptive-cron-lite
    command: adaptive-cron --profile lite
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./configs/lite.yaml:/etc/adaptive-cron/config.yaml:ro
    environment:
      - ADAPTIVE_CRON_PROFILE=lite
      - ADAPTIVE_CRON_LOG_LEVEL=info
    networks:
      - adaptive-cron-net
    restart: unless-stopped

networks:
  adaptive-cron-net:
    driver: bridge

volumes:
  data:
  logs: