profile: enterprise
database:
  type: postgres
  host: postgres-master
  port: 5432
  user: cron_user
  password: cron_pass
  dbname: adaptive_cron
  replication:
    enabled: true
    slave_hosts:
      - postgres-slave1:5432
      - postgres-slave2:5432

queue:
  type: nats
  servers:
    - nats://nats1:4222
    - nats://nats2:4222
  persistent: true

logging:
  type: clickhouse
  level: info
  format: json
  host: clickhouse
  port: 9000
  database: adaptive_cron
  table: logs
  batch_size: 100
  flush_interval: 5s

server:
  http_port: 8080
  grpc_port: 9090
  nats_port: 4222

metrics:
  type: prometheus
  port: 9091

worker:
  max_concurrent: 50
  queue_size: 1000

scheduler:
  type: distributed
  check_interval: 10s
  leadership:
    type: etcd
    endpoints:
      - etcd1:2379
      - etcd2:2379