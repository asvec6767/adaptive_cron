version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: adaptive_cron
      POSTGRES_USER: cron_user
      POSTGRES_PASSWORD: cron_pass
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - redis_data:/data

  app:
    image: adaptive-cron:latest
    command: --profile standard --config /etc/adaptive-cron/config.yaml
    volumes:
      - ./logs:/logs
      - ./config/standard.yaml:/etc/adaptive-cron/config.yaml:ro
    ports:
      - "8080:8080"
      - "9090:9090"
      - "9091:9091"
    environment:
      - ADAPTIVE_CRON_PROFILE=standard
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

volumes:
  pg_data:
  redis_data: