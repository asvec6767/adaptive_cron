version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: adaptive-cron-postgres
    environment:
      POSTGRES_DB: adaptive_cron
      POSTGRES_USER: cron_user
      POSTGRES_PASSWORD: cron_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - adaptive-cron-net
    restart: unless-stopped
    profiles:
      - standard
      - enterprise

  redis:
    image: redis:7-alpine
    container_name: adaptive-cron-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - adaptive-cron-net
    restart: unless-stopped
    profiles:
      - standard
      - enterprise

networks:
  adaptive-cron-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: