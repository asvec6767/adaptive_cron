version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: adaptive-cron-postgres
    environment:
      POSTGRES_DB: adaptive_cron
      POSTGRES_USER: cron_user
      POSTGRES_PASSWORD: cron_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - adaptive-cron-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: adaptive-cron-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - adaptive-cron-net
    restart: unless-stopped

  metric-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-cron-metric-agent
    command: ./metric-agent
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - COLLECT_INTERVAL=5s
      - LOG_LEVEL=info
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - adaptive-cron-net
    restart: unless-stopped

  task-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-cron-task-manager
    command: ./task-manager
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=cron_user
      - DB_PASSWORD=cron_pass
      - DB_NAME=adaptive_cron
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=info
    depends_on:
      - postgres
      - redis
    networks:
      - adaptive-cron-net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-cron-worker
    command: ./worker
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - MAX_CONCURRENT=5
      - LOG_LEVEL=info
    networks:
      - adaptive-cron-net
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-cron-scheduler
    command: ./scheduler
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=cron_user
      - DB_PASSWORD=cron_pass
      - DB_NAME=adaptive_cron
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - METRIC_AGENT_URL=http://metric-agent:8083
      - WORKER_URL=http://worker:8084
      - CHECK_INTERVAL=10s
      - LOG_LEVEL=info
    depends_on:
      - postgres
      - redis
      - metric-agent
      - worker
    networks:
      - adaptive-cron-net
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-cron-api-gateway
    command: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - TASK_MANAGER_URL=http://task-manager:8081
      - SCHEDULER_URL=http://scheduler:8082
      - METRIC_AGENT_URL=http://metric-agent:8083
      - WORKER_URL=http://worker:8084
      - LOG_LEVEL=info
    depends_on:
      - task-manager
      - scheduler
      - metric-agent
      - worker
    networks:
      - adaptive-cron-net
    restart: unless-stopped

networks:
  adaptive-cron-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: